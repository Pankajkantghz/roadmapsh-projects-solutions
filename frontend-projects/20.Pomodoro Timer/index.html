<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="header">
    <h2>Daily Focus Tracker</h2>

    <div class="total-box">
        <span class="label">Today's Focus</span>
        <span id="total-time" class="total-value">00:00:00</span>
    </div>
</div>

    <div class="timer-circle">
      <h1 id="time">00:00:00</h1>
    </div>

    <input type="number" id="user-input" placeholder="Enter minutes">

    <div class="buttons">
      <button id="start" class="start-btn">Start</button>
      <button id="stop" class="stop-btn">Stop</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
