<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main>


        <h3>Task Tracker</h3>
        <div class="input-container">

            <input type="text" placeholder="Start writing and press enter to create task" />
            <button class="add-btn">↵</button>
        </div>
        <div class="task-container">
            <ul>
                <li>
                    <div class="list-content">
                        <input type="checkbox" />
                        <span class="task-text">text</span>
                    </div>

                    <div class="list-button">
                        <button>-</button>
                    </div>
                </li>

               <li>
                    <div class="list-content">
                        <input type="checkbox" />
                        <span class="task-text">fir party hui thi aaj</span>
                    </div>

                    <div class="list-button">
                        <button>-</button>
                    </div>
                </li>
                <li>
                    <div class="list-content">
                        <input type="checkbox" />
                        <span class="task-text">Ram is good boy</span>
                    </div>

                    <div class="list-button">
                        <button>-</button>
                    </div>
                </li>
            </ul>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
